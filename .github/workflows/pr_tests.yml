name: pr_tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ./ci
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  DEFAULT_TARGET: snowflake
  SCHEMA_SUFFIX: ci_${{ github.run_id }}_${{ github.run_attempt }}
  SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
  SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
  SNOWFLAKE_TEST_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}
  SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
  SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
  SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}

jobs:
  pr_tests:
    # Fork PRs do not receive warehouse credentials. A maintainer can test a reviewed
    # branch in this repository using workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./integration_tests

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exercise new dbt 1.x releases so CI catches upstream regressions.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade "dbt-core==1.*" "dbt-snowflake==1.*"
          dbt deps

      - name: Check warehouse connection
        id: connection
        run: dbt debug --target snowflake

      - name: Run integration tests
        run: bash .scripts/integration_tests.sh -d snowflake

      - name: Drop CI schemas
        if: ${{ always() && steps.connection.outcome == 'success' }}
        run: dbt run-operation post_ci_cleanup --target snowflake
